<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<title>Test ishlash</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body { font-family: Arial; padding:20px; background:#f5f5f5; }
.q { background:white; padding:10px; margin:10px 0; border-radius:10px; }
button { padding:10px 18px; border:none; border-radius:8px; cursor:pointer; background:#2b7cff; color:white; }
</style>
</head>

<body>

<h2>Test ishlash</h2>

<!-- 🔑 TEST KOD -->
<div class="q">
🔑 Test kodi:
<input type="text" id="code">
</div>

<div id="form"></div>

<button onclick="submitTest()">📤 Javob yuborish</button>

<script>
let f = document.getElementById("form");

// 1–32
for(let i=1;i<=32;i++){
  f.innerHTML += `
  <div class="q">
  ${i}:
  A<input type="radio" name="q${i}" value="A">
  B<input type="radio" name="q${i}" value="B">
  C<input type="radio" name="q${i}" value="C">
  D<input type="radio" name="q${i}" value="D">
  </div>`;
}

// 33–35
for(let i=33;i<=35;i++){
  f.innerHTML += `
  <div class="q">
  ${i}:
  A<input type="radio" name="q${i}" value="A">
  B<input type="radio" name="q${i}" value="B">
  C<input type="radio" name="q${i}" value="C">
  D<input type="radio" name="q${i}" value="D">
  E<input type="radio" name="q${i}" value="E">
  F<input type="radio" name="q${i}" value="F">
  </div>`;
}

// 36–39
for(let i=36;i<=39;i++){
  f.innerHTML += `
  <div class="q">
  ${i}: <input id="q${i}">
  </div>`;
}

// 40–44
for(let i=40;i<=44;i++){
  f.innerHTML += `
  <div class="q">
  ${i}:
  A) <input id="q${i}a">
  B) <input id="q${i}b">
  </div>`;
}

// 45 esse
f.innerHTML += `
<div class="q">
45 (esse 0–75):
<input type="number" id="q45" min="0" max="75">
</div>`;


// =====================
// YUBORISH
// =====================
function submitTest(){
  let data = {};

  // 1–35
  for(let i=1;i<=35;i++){
    let v = document.querySelector(`input[name=q${i}]:checked`);
    data["q"+i] = v ? v.value : "";
  }

  // 36–39
  for(let i=36;i<=39;i++){
    data["q"+i] = document.getElementById("q"+i).value;
  }

  // 40–44
  for(let i=40;i<=44;i++){
    data["q"+i] = {
      a: document.getElementById("q"+i+"a").value,
      b: document.getElementById("q"+i+"b").value
    }
  }

  let esse = Number(document.getElementById("q45").value || 0);

  let payload = {
    code: document.getElementById("code").value.trim(),
    answers: data,
    esse: esse
  };

  // 🔥 BOTGA YUBORISH
  Telegram.WebApp.sendData(JSON.stringify(payload));

  // 🔥 YOPISH
  Telegram.WebApp.close();
}
</script>

</body>
</html>
